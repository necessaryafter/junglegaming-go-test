name: jungle

x-app: &app
  build: .
  environment:
    HTTP_ADDRESS: :8081
    OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-60s}
    DATABASE_URL: postgres://jungle_runtime:${POSTGRES_RUNTIME_PASSWORD:-jungle-runtime-local}@postgres:5432/jungle?sslmode=disable
    OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/jungle
    OIDC_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
    OIDC_AUDIENCE: jungle-api
    AWS_REGION: us-east-1
    AWS_SHARED_CREDENTIALS_FILE: /run/sqs/credentials
    SQS_PRODUCER_KEYS_FILE: /run/sqs/producers.json
    SQS_ENDPOINT: http://localstack:4566
  volumes:
    - sqs-runtime:/run/sqs:ro
  depends_on:
    queue-bootstrap:
      condition: service_completed_successfully
    db-grants:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/usr/local/bin/healthcheck", "-url", "http://localhost:8081/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 10
  stop_grace_period: 35s
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8081"

  app-2:
    <<: *app
    profiles: [replicas]
    ports:
      - "127.0.0.1:8082:8081"

  app-3:
    <<: *app
    profiles: [replicas]
    ports:
      - "127.0.0.1:8083:8081"

  prometheus:
    image: docker.io/prom/prometheus:v3.8.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:12.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jungle.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    entrypoint: ["migrate"]
    command: ["up"]
    environment:
      MIGRATION_DATABASE_URL: postgres://jungle_migrator:${POSTGRES_MIGRATION_PASSWORD:-jungle-migration-local}@postgres:5432/jungle?sslmode=disable
    depends_on:
      db-roles:
        condition: service_completed_successfully

  db-roles:
    image: docker.io/library/postgres:17.2-alpine
    entrypoint: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/opt/jungle/bootstrap.psql"]
    environment:
      PGHOST: postgres
      PGDATABASE: jungle
      PGUSER: jungle
      PGPASSWORD: ${POSTGRES_PASSWORD:-jungle-local}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-jungle-migration-local}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-jungle-runtime-local}
    volumes:
      - ./docker/postgres:/opt/jungle:ro
    depends_on:
      postgres:
        condition: service_healthy

  db-grants:
    image: docker.io/library/postgres:17.2-alpine
    entrypoint: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/opt/jungle/grants.psql"]
    environment:
      PGHOST: postgres
      PGDATABASE: jungle
      PGUSER: jungle_migrator
      PGPASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-jungle-migration-local}
    volumes:
      - ./docker/postgres:/opt/jungle:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: docker.io/library/postgres:17.2-alpine
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak-db:
    image: docker.io/library/postgres:17.2-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped

  queue-bootstrap:
    image: docker.io/ministackorg/ministack:1.5.27
    user: "0:0"
    entrypoint: ["python", "/opt/jungle/bootstrap.py"]
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
    volumes:
      - ./docker/sqs:/opt/jungle:ro
      - sqs-runtime:/runtime
      - sqs-provider-a:/provider-a
      - sqs-provider-b:/provider-b
    depends_on:
      localstack:
        condition: service_healthy

  producer-a:
    build: .
    profiles: [tools]
    entrypoint: ["publish"]
    environment:
      AWS_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /run/producer/credentials
      SQS_ENDPOINT: http://localstack:4566
      SQS_SIGNING_KEY_ID: provider-a-v1
      SQS_SIGNING_KEY_FILE: /run/producer/signing.pem
    volumes:
      - sqs-provider-a:/run/producer:ro
    depends_on:
      queue-bootstrap:
        condition: service_completed_successfully

  producer-b:
    build: .
    profiles: [tools]
    entrypoint: ["publish"]
    environment:
      AWS_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /run/producer/credentials
      SQS_ENDPOINT: http://localstack:4566
      SQS_SIGNING_KEY_ID: provider-b-v1
      SQS_SIGNING_KEY_FILE: /run/producer/signing.pem
    volumes:
      - sqs-provider-b:/run/producer:ro
    depends_on:
      queue-bootstrap:
        condition: service_completed_successfully

  localstack:
    image: docker.io/ministackorg/ministack:1.5.27
    environment:
      SERVICES: sqs,iam,sts,cloudwatch
      AUTH: "true"
      PERSIST_STATE: "1"
      STATE_DIR: /var/lib/ministack
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
      - sqs-state:/var/lib/ministack
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/jungle-sqs-ready && awslocal sqs list-queues >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 30
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  keycloak-db-data:
  sqs-state:
  sqs-runtime:
  sqs-provider-a:
  sqs-provider-b:
